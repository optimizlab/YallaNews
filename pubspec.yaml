name: yallanews
description: "Yalla News - Smart real-time Arabic and world news reader with curated summaries, offline reading, text-to-speech, dark mode, and trusted sources."
publish_to: 'none'

version: 26.11.16+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  http: ^1.2.1
  ffi: ^2.1.2
  flutter_svg: ^2.0.10
  lottie: ^3.3.1
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.5.6
  shared_preferences_windows: ^2.4.1
  path: ^1.9.1
  html: ^0.15.0
  vector_math: ^2.1.4
  package_info_plus: ^9.0.1
  timezone: ^0.10.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  
  # Cross-platform plugins with Windows support
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.0
  geolocator: ^13.0.1
  google_mobile_ads: ^5.3.0
  flutter_tts: ^4.2.1
  audioplayers: ^6.0.0
  workmanager: ^0.10.0

dependency_overrides:
  win32: "5.5.1"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/img/yallanews_logo_2.svg
    - assets/img/inoov_logo.svg
    - assets/img/play_store_icon_512.png
    - assets/animations/empty_news.json
    - assets/audio/adhan/adhan_makkah.mp3
    - assets/audio/adhan/adhan_afasy.mp3
    - assets/audio/adhan/adhan_qatami.mp3
    - assets/audio/adhan/adhan_imadi.mp3
    - assets/audio/adhan/adhan_madinah.mp3
    - assets/audio/adhan/adhan_egypt.mp3
    - assets/audio/adhan/adhan_yemen.mp3
    - assets/audio/adhan/adhan_iraq.mp3
    - assets/audio/adhan/adhan_turkish.mp3
    - assets/audio/adhan/adhan_moroccan.mp3
