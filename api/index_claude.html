<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YallaNews</title>
<meta name="description" content="YallaNews">
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("yn-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#fbf8f7;--ink:#1b1a1d;--muted:#6a666b;--red:#c4262e;--soft:#f3e5e5;--soft-ink:#5a2a2d;--line:#e6dede;--navy:#0f1829;--head:rgba(251,248,247,.94);--shadow:rgba(60,20,20,.16);color-scheme:light}
[data-theme=dark]{--bg:#121218;--ink:#eceaf0;--muted:#a29fab;--red:#ff6b72;--soft:#2a1d20;--soft-ink:#f0cfd1;--line:#2c2b36;--navy:#0b111e;--head:rgba(18,18,24,.94);--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Poppins","Segoe UI",Tahoma,system-ui,sans-serif}
a{color:var(--red)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;background:var(--head);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;align-items:center;gap:10px;padding:12px 20px}
.logo{font-weight:700;font-size:1.3rem;color:var(--ink);text-decoration:none;margin-inline-end:auto}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-inline-end:8px}
nav.top a{margin-inline-start:16px;color:var(--muted);text-decoration:none;font-size:.93rem}
nav.top a:hover{color:var(--ink)}
.ctl{height:38px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-size:.9rem;cursor:pointer;padding:0 10px}
select.ctl{background:var(--bg)}
#theme,#burger{width:38px;padding:0;font-size:1.1rem}
#burger{display:none}
#drawer,#veil{display:none}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;padding:56px 20px 40px}
h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1.15;margin:0 0 16px}
[lang=ar] h1{line-height:1.35}
.lead{color:var(--muted);max-width:46ch}
.btns{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 22px;border-radius:999px;background:var(--red);color:#fff;font-weight:600;text-decoration:none}
[data-theme=dark] .btn{color:#1b0a0c}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.shots{display:flex;justify-content:center;gap:16px;direction:ltr}
.shots img{width:46%;max-width:230px;border-radius:18px;border:1px solid var(--line);box-shadow:0 14px 34px var(--shadow)}
.shots img+img{margin-top:44px}
section{padding:52px 0;border-top:1px solid var(--line)}
h2{font-size:1.6rem;margin:0 0 12px}
.sub{color:var(--muted);max-width:62ch;margin:0 0 24px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px 32px}
.feat h3{margin:0 0 4px;font-size:1.05rem;border-inline-start:3px solid var(--red);padding-inline-start:10px}
.feat p{margin:0;color:var(--muted)}
.split{display:grid;grid-template-columns:230px 1fr;gap:36px;align-items:center}
.split img,.dark img.wide{width:100%;border-radius:14px;border:1px solid var(--line)}
.dark{background:var(--navy);color:#e8edf6;border-top:0}
.dark .sub{color:#a3afc6}
.dark .row{display:grid;grid-template-columns:1fr;gap:28px;align-items:end;margin-top:28px}
.dark img{border-color:#26334f}
ul{padding-inline-start:20px;color:var(--muted)}
.contact dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 22px;margin:0}
.contact dt{color:var(--muted)}
.contact dd{margin:0}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9rem}
@media(max-width:760px){
 nav.top{display:none}
 #burger{display:inline-block}
 .hero .wrap,.split,.dark .row{grid-template-columns:1fr}
 .split img{max-width:260px;margin:auto}
 .dark .row img{max-width:220px;margin:auto}
 #veil{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:8}
 #drawer{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(78vw,300px);background:var(--bg);border-inline-end:1px solid var(--line);padding:18px 14px;transform:translateX(-100%);transition:transform .25s;z-index:9;visibility:hidden}
 [dir=rtl] #drawer{transform:translateX(100%)}
 body.open #drawer{transform:none;visibility:visible}
 body.open #veil{opacity:1;visibility:visible}
 #drawer .logo{margin:0 0 18px 0}
 #drawer a.item{color:var(--ink);text-decoration:none;padding:12px 10px;border-radius:10px;border-bottom:1px solid var(--line)}
 #drawer a.item:hover{background:var(--soft)}
 #drawer .close{align-self:flex-end;width:38px}
}

.btn.sm{padding:7px 16px;font-size:.9rem}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0;padding:0;list-style:none}
.pills li{background:var(--soft);color:var(--soft-ink);border-radius:999px;padding:3px 12px;font-size:.85rem;margin:0}
.cta{background:var(--soft)}
.cta .pills li{background:var(--bg)}
.cta .wrap{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
.cta h2{font-size:clamp(1.7rem,4vw,2.3rem)}
.cta .sub{color:var(--soft-ink)}
.qr{text-align:center;max-width:170px;color:var(--soft-ink);font-size:.85rem}
.qr img{width:150px;height:150px;background:#fff;padding:10px;border-radius:14px;display:block;margin:0 auto 8px}
#bar{display:none}
@media(max-width:760px){
 #hdl{display:none}
 .cta .wrap{grid-template-columns:1fr}.qr{display:none}
 #bar{display:flex;align-items:center;gap:10px;position:fixed;inset-inline:0;bottom:0;z-index:7;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px;box-shadow:0 -6px 18px var(--shadow)}
 body.bar{padding-bottom:64px}
 #bar span{margin-inline-end:auto;font-weight:600;font-size:.95rem}
 #bar button{border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:6px}
}

.stores{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding:0;list-style:none}
.store{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;min-width:158px}
.store svg{width:26px;height:26px;fill:currentColor;flex:none}
.store span{display:flex;flex-direction:column;line-height:1.2}
.store small{font-size:.72rem;color:var(--muted)}
.store b{font-size:.98rem}
a.store{border-color:var(--red)}
.store.off{opacity:.65}
.cta-sub{margin:26px 0 0;font-weight:600}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;list-style:none;padding:0;margin:18px 0}
.logos li{background:#fff;border:1px solid var(--line);border-radius:12px;height:76px;display:flex;align-items:center;justify-content:center;padding:10px;margin:0}
.logos img{max-height:46px;max-width:100%;object-fit:contain}
.wm{font-weight:700;color:#222;font-size:1.05rem;text-align:center}
.gal{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:8px}
.gal img{width:30%;min-width:150px;max-width:230px;border-radius:16px;border:1px solid var(--line);box-shadow:0 12px 28px var(--shadow)}
.faq details{border-bottom:1px solid var(--line);padding:2px 0}
.faq summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--red);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 16px;color:var(--muted);max-width:68ch}
#cform{margin-top:34px;max-width:640px;display:grid;gap:14px}
#cform h3{margin:0;font-size:1.2rem}
#cform label{display:grid;gap:5px;font-size:.92rem;color:var(--muted)}
#cform input,#cform select,#cform textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
#cform textarea{min-height:130px;resize:vertical}
#cform .hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#cform button{justify-self:start;border:0;cursor:pointer;font:inherit}
#fstat{min-height:1.4em;color:var(--red);margin:0}
.btn.play{display:inline-flex;align-items:center;justify-content:center;gap:10px}
#prog{position:fixed;top:0;inset-inline:0;height:3px;background:var(--red);transform-origin:left;transform:scaleX(0);z-index:20;pointer-events:none}
[dir=rtl] #prog{transform-origin:right}
header{transition:box-shadow .3s,background .3s}
header.scrolled{box-shadow:0 6px 24px var(--shadow)}
nav.top a{position:relative;transition:color .2s}
nav.top a::after{content:"";position:absolute;inset-inline:0;bottom:-6px;height:2px;background:var(--red);transform:scaleX(0);transition:transform .25s}
nav.top a:hover::after,nav.top a.on::after{transform:scaleX(1)}
nav.top a.on{color:var(--ink)}
.js .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease var(--d,0ms),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms),translate .25s,box-shadow .25s,border-color .25s}
.js .reveal.in{opacity:1;transform:none}
#glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,rgba(196,38,46,.14),transparent 62%);pointer-events:none;z-index:1;opacity:0;transition:opacity .4s;will-change:transform}
[data-theme=dark] #glow{background:radial-gradient(circle,rgba(255,107,114,.16),transparent 62%)}
#glow.on{opacity:1}
header,main,footer{position:relative;z-index:2}
header{z-index:5}
.shots{perspective:900px}
.shots img{transform:translate3d(calc(var(--mx,0)*10px*var(--z,1)),calc(var(--my,0)*8px*var(--z,1)),0) rotateY(calc(var(--mx,0)*-7deg*var(--z,1))) rotateX(calc(var(--my,0)*5deg*var(--z,1)));transition:transform .25s ease-out;animation:float 7s ease-in-out infinite}
.shots img:nth-child(1){--z:1}
.shots img:nth-child(2){--z:-1.5;animation-delay:-3.5s}
@keyframes float{50%{translate:0 -10px}}
.tilt{transform:perspective(900px) translateY(var(--ty,0)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .25s;will-change:transform}
.tilt:hover{box-shadow:0 22px 44px var(--shadow)}
.btn{translate:var(--bx,0) var(--by,0);transition:translate .2s ease-out,box-shadow .25s,background .25s,color .25s}
.btn:hover{box-shadow:0 10px 24px rgba(196,38,46,.38)}
.btn.alt:hover{background:var(--soft)}
.btn:active{scale:.96}
.store,.logos li,.pills li,.feat>div{transition:translate .25s,box-shadow .25s,border-color .25s,background .25s}
a.store:hover,.logos li:hover{translate:0 -4px;box-shadow:0 12px 26px var(--shadow)}
.logos img{transition:scale .25s}
.logos li:hover img{scale:1.12}
.feat>div:hover{translate:0 -3px}
.feat>div:hover h3{border-color:var(--ink)}
.pills li:hover{translate:0 -2px}
.faq summary{transition:color .2s}
.faq summary:hover{color:var(--red)}
.faq summary::after{transition:transform .25s}
.faq details[open] summary::after{transform:rotate(180deg)}
.faq details[open] p{animation:fadeDown .35s ease}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}}
#cform input,#cform select,#cform textarea{transition:border-color .2s,box-shadow .2s}
#cform input:focus,#cform select:focus,#cform textarea:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px rgba(196,38,46,.18)}
#drawer a.item{transition:background .2s,padding-inline-start .2s}
#drawer a.item:hover{padding-inline-start:18px}
@media(prefers-reduced-motion:reduce){
 .js .reveal{opacity:1!important;transform:none!important;transition:none!important}
 *{animation:none!important}
 .tilt,.shots img{transform:none!important}
 .btn,.store,.logos li,.feat>div,.pills li{translate:none!important}
 #glow{display:none}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#drawer,#veil{transition:none}}
</style>
</head>

en:{ps_t:"Your language, your theme, your alerts",ps_d:"Switch the app between Arabic, English, Français and Türkçe, choose light or dark mode, and turn breaking-news notifications on or off in Settings.",a8:"YallaNews settings with language choice, dark mode and breaking news notifications",a9:"YallaNews home screen in dark theme with breaking news",nvf:"FAQ",sx_t:"Coming to your favorite stores",sx_d:"YallaNews is on Google Play now. More stores are on the way.",sx_av:"Available now",sx_soon:"Coming soon",fq_t:"Frequently asked questions",fq1:"What is YallaNews?",fa1:"A free news aggregator. It gathers Arabic headlines from international publishers, groups them by category and sends you to the original article.",fq2:"Does YallaNews write the articles?",fa2:"No. Every article belongs to its publisher. We show the headline, a thumbnail, a short summary and the publisher’s name, and the full story opens on the publisher’s website.",fq3:"Is the app really free?",fa3:"Yes. YallaNews is free to download and use.",fq4:"Are the summaries reliable?",fa4:"Summaries and tone labels are generated automatically and can be wrong. Treat them as a quick preview and read the original article for the full, accurate story.",fq5:"Do I need an account?",fa5:"You can create an account with your email address from the account icon at the top of the app. You can ask us to delete your account and data at any time through the contact form.",fq6:"How often is the news updated?",fa6:"The feed refreshes throughout the day. The app only shows recent stories and removes older ones.",fq7:"I am a publisher. How can I have my content removed?",fa7:"Use the contact form below, choose “Content removal request” and include the link to the article or your website. We will act on it promptly.",fm_t:"Send us a message",fm_purpose:"What is this about?",fm_p0:"General question",fm_p1:"Feedback or suggestion",fm_p2:"Report a problem",fm_p3:"Content removal request (publishers)",fm_p4:"Partnership or busine ar:{ps_t:"لغتك ومظهرك وتنبيهاتك",ps_d:"بدّل لغة التطبيق بين العربية وEnglish وFrançais وTürkçe، واختر المظهر الفاتح أو الداكن، وفعّل أو أوقف إشعارات الأخبار العاجلة من الإعدادات.",a8:"إعدادات يلا نيوز مع اختيار اللغة والوضع الداكن وإشعارات الأخبار العاجلة",a9:"الشاشة الرئيسية في يلا نيوز بالمظهر الداكن مع الأخبار العاجلة",nvf:"الأسئلة الشائعة",sx_t:"قريباً في متاجرك المفضلة",sx_d:"يلا نيوز متوفر الآن على Google Play، والمزيد من المتاجر في الطريق.",sx_av:"متوفر الآن",sx_soon:"قريباً",fq_t:"الأسئلة الشائعة",fq1:"ما هو يلا نيوز؟",fa1:"مجمّع أخبار مجاني. يجمع العناوين العربية من ناشرين دوليين، ويصنفها حسب الفئة، ويحيلك إلى المقال الأصلي.",fq2:"هل يكتب يلا نيوز المقالات؟",fa2:"لا. كل مقال ملك لناشره. نعرض العنوان وصورة مصغرة وملخصاً قصيراً واسم الناشر، ويُفتح الخبر كاملاً على موقع الناشر.",fq3:"هل التطبيق مجاني فعلاً؟",fa3:"نعم. تحميل يلا نيوز واستخدامه مجانيان.",fq4:"هل الملخصات موثوقة؟",fa4:"الملخصات ومؤشرات المشاعر تُولَّد آلياً وقد تخطئ. اعتبرها معاينة سريعة، واقرأ المقال الأصلي للحصول على الخبر الكامل والدقيق.",fq5:"هل أحتاج إلى حساب؟",fa5:"يمكنك إنشاء حساب ببريدك الإلكتروني من أيقونة الحساب أعلى التطبيق. ويمكنك طلب حذف حسابك وبياناتك في أي وقت عبر نموذج الاتصال.",fq6:"كم مرة تُحدَّث الأخبار؟",fa6:"يتجدد الموجز على مدار اليوم. يعرض التطبيق الأخبار الحديثة فقط ويزيل القديمة.",fq7:"أنا ناشر، كيف أطلب إزالة محتواي؟",fa7:"استخدم نموذج الاتصال أدناه واختر «طلب إزالة محتوى» وأرفق رابط المقال أو موقعك. سننفذ الطلب بسرعة.",fm_t:"أرسل لنا رسالة",fm_purpose:"موضوع الرسالة",fm_p0:"سؤال عام",fm_p1:"ملاحظة أو اقتراح",fm_p2:"الإبلاغ عن مشكلة",fm_p3:"طلب إزالة محتوى (للناشرين)",fm_p4:"شراكة أو أعمال",fm_p5:"طلب يخص الحساب أو الخصوصية",fm_name:"الاسم",fm_email:"بريدك الإلكتروني",fm_msg:"الرسالة",fm_send:"إرسال",fm_ok:"شكراً! تم إرسال رسالتك وسنرد خلال 3 أيام عمل.",fm_mail:"يُفترض أن يفتح تطبيق البريد برسالة جاهزة للإرسال. وإن لم يحدث شيء فراسلنا على contact@inoov.com.",a6:"شاشة تسجيل الدخول في يلا نيوز",a7:"قائمة الأخبار في يلا نيوز بالمظهر الفاتح مع أسماء الناشرين",dlh:"حمّل التطبيق",b1:"مجاني",b2:"يُحدَّث على مدار اليوم",b3:"المصدر الأصلي مع كل خبر",cta_t:"حمّل يلا نيوز مجاناً",cta_d:"عناوين اليوم العربية في مكان واحد، مع ناشرها الأصلي في كل خبر. ثبّته مرة واحدة وابقَ على اطلاع أينما كنت.",qr:"امسح الرمز بهاتفك للتثبيت",bar:"حمّل التطبيق المجاني",doc:"يلا نيوز – أخبار عربية من ناشرين موثوقين في موجز واحد",desc:"يلا نيوز تطبيق مجاني لتجميع الأخبار العربية. يعرض كل خبر اسم ناشره ويحيلك إلى المقال الأصلي.",

var $=function(s){return document.querySelector(s)},root=document.documentElement,sel=$("#lang");
function setLang(l){
  if(!T[l])l="en";var t=T[l];
  root.lang=l;root.dir=l==="ar"?"rtl":"ltr";sel.value=l;
  document.title=t.doc;$("meta[name=description]").content=t.desc;
  document.querySelectorAll("[data-i18n]").forEach(function(e){e.innerHTML=t[e.dataset.i18n]});
  document.querySelectorAll("[data-i18n-alt]").forEach(function(e){e.alt=t[e.dataset.i18nAlt]});
  $("#theme").setAttribute("aria-label",t.theme);$("#theme").title=t.theme;
  $("#burger").setAttribute("aria-label",t.menu);$("#close").setAttribute("aria-label",t.menu);
  try{localStorage.setItem("yn-lang",l)}catch(e){}
}
function setTheme(m){root.dataset.theme=m;$("#theme").textContent=m==="dark"?"☀":"☾";try{localStorage.setItem("yn-theme",m)}catch(e){}}
function drawer(open){document.body.classList.toggle("open",open);$("#burger").setAttribute("aria-expanded",open)}
var saved=null;try{saved=localStorage.getItem("yn-lang")}catch(e){}
setLang(saved||(navigator.language||"en").slice(0,2));
setTheme(root.dataset.theme);
sel.addEventListener("change",function(){setLang(sel.value)});
$("#theme").addEventListener("click",function(){setTheme(root.dataset.theme==="dark"?"light":"dark")});
$("#burger").addEventListener("click",function(){drawer(true);$("#close").focus()});
$("#close").addEventListener("click",function(){drawer(false);$("#burger").focus()});
$("#veil").addEventListener("click",function(){drawer(false)});
document.querySelectorAll("#drawer a").forEach(function(a){a.addEventListener("click",function(){drawer(false)})});
var logoFix=function(img){if(!img.dataset.f){img.dataset.f="1";img.src="https://www.google.com/s2/favicons?domain="+img.dataset.d+"&sz=128";return}var s=document.createElement("span");s.className="wm";s.textContent=img.dataset.n;img.replaceWith(s)};
document.querySelectorAll(".lg").forEach(function(i){i.addEventListener("error",function(){logoFix(i)});if(i.complete&&!i.naturalWidth)logoFix(i)});

cf.addEventListener("submit",function(e){e.preventDefault();if($("#fhp").value)return;if(!cf.reportValidity())return;
 var p=$("#fpurpose"),d={purpose:p.options[p.selectedIndex].text,name:$("#fname").value,email:$("#femail").value,message:$("#fmsg").value};

 fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(d)}).then(function(r){if(!r.ok)throw 0;fst.textContent=T[root.lang].fm_ok;cf.reset()}).catch(function(){viaMail(d)})});

if(!bs)document.body.classList.add("bar");else $("#bar").style.display="none";

<script>
(function(){
var rm=matchMedia("(prefers-reduced-motion: reduce)").matches,fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
var q=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
/* reveal on scroll */
var els=[];
["main section h2","main .sub",".hero .wrap>div:first-child",".feat>div",".gal",".logos li",".stores li",".faq details",".cta .wrap>div",".contact dl","#cform",".dark .row p","#privacy p"].forEach(function(s){
  q(s).forEach(function(e,i){if(e.classList.contains("reveal"))return;e.classList.add("reveal");e.style.setProperty("--d",(i%6)*70+"ms");els.push(e)})});
if(rm||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")})}
else{var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}})},{threshold:.12,rootMargin:"0px 0px -6% 0px"});els.forEach(function(e){io.observe(e)})}
/* scroll progress, sticky header shadow, active nav link */
var prog=document.getElementById("prog"),hd=document.querySelector("header"),links=q("nav.top a"),secs=["features","sources","faq","contact","privacy"].map(function(i){return document.getElementById(i)}),tick=false;
function onScroll(){tick=false;var y=window.scrollY,m=document.documentElement.scrollHeight-innerHeight;
  prog.style.transform="scaleX("+(m>0?y/m:0)+")";hd.classList.toggle("scrolled",y>8);
  var cur="";secs.forEach(function(s){if(s&&s.getBoundingClientRect().top<140)cur=s.id});
  links.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+cur)})}
addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});onScroll();
if(rm||!fine)return;
/* cursor glow + hero parallax */
var glow=document.getElementById("glow"),sh=document.querySelector(".shots"),raf=0,mx=0,my=0,cx=0,cy=0;
addEventListener("mousemove",function(e){cx=e.clientX;cy=e.clientY;glow.classList.add("on");
  if(!raf)raf=requestAnimationFrame(function(){raf=0;glow.style.transform="translate("+cx+"px,"+cy+"px)";
    if(sh){sh.style.setProperty("--mx",((cx/innerWidth-.5)*2).toFixed(3));sh.style.setProperty("--my",((cy/innerHeight-.5)*2).toFixed(3))}})});
document.addEventListener("mouseleave",function(){glow.classList.remove("on")});
/* 3D tilt on screenshots */
q(".gal img,.dark img.wide").forEach(function(im){im.classList.add("tilt");
  im.addEventListener("mousemove",function(e){var r=im.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,k=r.width>600?.35:1;
    im.style.setProperty("--ry",(x*14*k).toFixed(2)+"deg");im.style.setProperty("--rx",(-y*10*k).toFixed(2)+"deg");im.style.setProperty("--ty","-6px")});
  im.addEventListener("mouseleave",function(){["--ry","--rx","--ty"].forEach(function(v){im.style.removeProperty(v)})})});
/* magnetic buttons */
q(".btn,a.store").forEach(function(b){
  b.addEventListener("mousemove",function(e){var r=b.getBoundingClientRect();
    b.style.setProperty("--bx",((e.clientX-r.left-r.width/2)*.18).toFixed(1)+"px");b.style.setProperty("--by",((e.clientY-r.top-r.height/2)*.28).toFixed(1)+"px")});
  b.addEventListener("mouseleave",function(){b.style.removeProperty("--bx");b.style.removeProperty("--by")})});
})();
</script>
